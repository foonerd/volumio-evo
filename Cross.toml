# cross-rs (https://github.com/cross-rs/cross): GTK/WebKit/libsoup for kiosk-browser.
#
# Canonical apt list: crates/kiosk-browser/apt-build-deps.txt
#
# Default cross images use Ubuntu ≤20.04; they do not ship GTK 4.10+ (required
# by current gtk-rs) or webkit2gtk 6 / libsoup 3 -dev. Use Ubuntu 24.04+ in
# docker/cross-kiosk/ (see docs/BUILD_GUIDE.md § Kiosk browser).

[target.x86_64-unknown-linux-gnu]
dockerfile = "./docker/cross-kiosk/Dockerfile.x86_64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
dockerfile = "./docker/cross-kiosk/Dockerfile.aarch64-unknown-linux-gnu"

[target.armv7-unknown-linux-gnueabihf]
dockerfile = "./docker/cross-kiosk/Dockerfile.armv7-unknown-linux-gnueabihf"

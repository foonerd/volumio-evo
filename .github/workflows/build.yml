name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build core (host)
        run: cargo build --release -p volumio-evo-core

      - name: Build example plugin (WASM)
        run: cargo build --release -p volumio-evo-plugin-example --target wasm32-unknown-unknown

  # Cross-build for Debian Trixie / Pi OS minimal image targets:
  # - arm64 (aarch64): Pi OS 64-bit, Trixie arm64. Cranelift.
  # - amd64 (x86_64): Trixie amd64. Native on runner. Cranelift.
  # - arm32/armhf (armv7): Pi 0, Pi 1, 32-bit Pi OS. Pulley interpreter (no Cranelift on 32-bit).
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            evo_features: ""
          - target: x86_64-unknown-linux-gnu
            evo_features: ""
          - target: armv7-unknown-linux-gnueabihf
            evo_features: "--no-default-features --features pulley"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        run: |
          rustup set profile minimal
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Install arm64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install armhf cross-compiler
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build core for ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --release -p volumio-evo-core --target ${{ matrix.target }} ${{ matrix.evo_features }}

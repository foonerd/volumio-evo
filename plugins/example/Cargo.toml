[package]
name = "volumio-evo-plugin-example"
version = "0.1.0"
edition = "2021"
description = "Example Volumio Evo WASM plugin"

[lib]
crate-type = ["cdylib"]

# WASM/no_std does not support panic unwinding; use abort.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"


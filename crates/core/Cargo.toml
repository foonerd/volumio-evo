[package]
name = "volumio-evo-core"
version = "0.1.0"
edition = "2021"
description = "Volumio Evo backend: API server and WASM plugin host"

[[bin]]
name = "volumio-evo"
path = "src/main.rs"

[features]
# WASM plugins via wasmtime (arm64, amd64). Disable for armhf (wasmtime runtime does not build for 32-bit ARM).
default = ["wasm"]
wasm = ["dep:wasmtime", "wasmtime/cranelift"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "multipart"] }
socketioxide = { version = "0.18", features = ["state", "v4"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "26", optional = true, default-features = false, features = ["wat", "runtime", "std"] }
anyhow = "1"
thiserror = "1"
mpd_client = "1.4"
# Use rustls instead of default (openssl) so armv7 cross-builds work without OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
image = "0.25"
if-addrs = "0.13"

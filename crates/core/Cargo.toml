[package]
name = "volumio-evo-core"
version = "0.1.0"
edition = "2021"
description = "Volumio Evo backend: API server and WASM plugin host"

[[bin]]
name = "volumio-evo"
path = "src/main.rs"

[features]
# Default: Cranelift JIT (arm64, amd64). For 32-bit (armhf) use --no-default-features --features pulley.
default = ["wasmtime/cranelift"]
# Pulley interpreter backend for 32-bit ARM (Pi 0, Pi 1, armhf). Slower than Cranelift but runs on armv7.
pulley = ["wasmtime/pulley"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cranelift (default) for arm64/amd64; use pulley feature for armhf (32-bit).
wasmtime = { version = "26", default-features = false, features = ["wat", "runtime", "std"] }
anyhow = "1"
thiserror = "1"

[package]
name = "volumio-evo-core"
version = "0.1.0"
edition = "2021"
description = "Volumio Evo backend: API server and WASM plugin host"

[[bin]]
name = "volumio-evo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "22", features = ["wat"] }
anyhow = "1"
thiserror = "1"
